<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<body>
<!--/*@thymesVar id="page" type="org.springframework.data.domain.Page"*/-->
<!-- tag::controls[] -->
<div th:fragment="controls"
     class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6 dark:border-white/10 dark:bg-transparent">
    <!-- end::controls[] -->

    <!-- Mobile pagination -->
    <!-- tag::mobile[] -->
    <div class="flex flex-1 justify-between sm:hidden">
        <a id="pagination-mobile-previous"
           th:with="link=${page.isFirst()}?'javascript:void(0)':${@urlBuilder.replaceQueryParam('page', page.number - 1).toUriString()}"
           th:href="${link}"
           class="relative inline-flex items-center rounded-md border px-4 py-2 text-sm font-medium"
           th:classappend="${page.isFirst()?'pointer-events-none border-gray-200 bg-white text-gray-300 dark:border-white/5 dark:bg-transparent dark:text-gray-600':'border-gray-300 bg-white text-gray-700 hover:bg-gray-50 dark:border-white/10 dark:bg-white/5 dark:text-gray-200 dark:hover:bg-white/10'}"
           th:aria-disabled="${page.isFirst()}"
           th:text="#{pagination.previous}">
            Previous
        </a>
        <a id="pagination-mobile-next"
           th:with="link=${page.isLast()}?'javascript:void(0)':${@urlBuilder.replaceQueryParam('page', page.number + 1).toUriString()}"
           th:href="${link}"
           class="relative ml-3 inline-flex items-center rounded-md border px-4 py-2 text-sm font-medium"
           th:classappend="${page.isLast()?'pointer-events-none border-gray-200 bg-white text-gray-300 dark:border-white/5 dark:bg-transparent dark:text-gray-600':'border-gray-300 bg-white text-gray-700 hover:bg-gray-50 dark:border-white/10 dark:bg-white/5 dark:text-gray-200 dark:hover:bg-white/10'}"
           th:aria-disabled="${page.isLast()}"
           th:text="#{pagination.next}">
            Next
        </a>
    </div>
    <!-- end::mobile[] -->

    <!-- Desktop pagination -->
    <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
        <!-- tag::pagination-summary[] -->
        <div>
            <p id="pagination-summary" class="text-sm text-gray-700 dark:text-gray-300">
                Showing
                <span class="font-medium" th:text="${(page.getSize() * page.getNumber()) + 1}">1</span>
                to
                <span class="font-medium" th:text="${(page.getSize() * page.getNumber()) + page.getNumberOfElements()}">10</span>
                of
                <span class="font-medium" th:text="${page.getTotalElements()}">97</span>
                results
            </p>
        </div>
        <!-- end::pagination-summary[] -->
        <div>
            <nav id="pagination-actions" aria-label="Pagination"
                 class="isolate inline-flex -space-x-px rounded-md shadow-xs dark:shadow-none">
                <!-- tag::pagination-previous[] -->
                <a id="pagination-previous"
                   th:with="link=${page.isFirst()}?'javascript:void(0)':${@urlBuilder.replaceQueryParam('page', page.number - 1).toUriString()}"
                   th:href="${link}"
                   class="relative inline-flex items-center rounded-l-md px-2 py-2 inset-ring inset-ring-gray-300 focus:z-20 focus:outline-offset-0 dark:inset-ring-gray-700"
                   th:classappend="${page.isFirst()?'pointer-events-none text-gray-200 dark:text-gray-700':'text-gray-400 hover:bg-gray-50 dark:hover:bg-white/5'}"
                   th:aria-disabled="${page.isFirst()}">
                    <span class="sr-only" th:text="#{pagination.previous}">Previous</span>
                    <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true" class="size-5">
                        <path d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
                              clip-rule="evenodd" fill-rule="evenodd"/>
                    </svg>
                </a>
                <!-- end::pagination-previous[] -->

                <!-- tag::pagenumbers[] -->
                <th:block
                        th:with="startPage=${T(java.lang.Math).max(1, page.getNumber() - 1)},endPage=${T(java.lang.Math).min(startPage + 4, page.getTotalPages())}">
                    <a th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}"
                       th:id="${'pagination-page-' + pageNumber}"
                       th:with="link=${@urlBuilder.replaceQueryParam('page', pageNumber - 1).toUriString()}"
                       th:href="${link}"
                       class="relative inline-flex items-center px-4 py-2 text-sm font-semibold focus:z-20"
                       th:classappend="${page.number == pageNumber - 1?'z-10 bg-indigo-600 text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-500 dark:focus-visible:outline-indigo-500':'text-gray-900 inset-ring inset-ring-gray-300 hover:bg-gray-50 focus:outline-offset-0 dark:text-gray-200 dark:inset-ring-gray-700 dark:hover:bg-white/5'}"
                       th:aria-current="${page.number == pageNumber - 1?'page':null}"
                       th:text="${pageNumber}">
                        1
                    </a>
                </th:block>
                <!-- end::pagenumbers[] -->

                <a id="pagination-next"
                   th:with="link=${page.isLast()}?'javascript:void(0)':${@urlBuilder.replaceQueryParam('page', page.number + 1).toUriString()}"
                   th:href="${link}"
                   class="relative inline-flex items-center rounded-r-md px-2 py-2 inset-ring inset-ring-gray-300 focus:z-20 focus:outline-offset-0 dark:inset-ring-gray-700"
                   th:classappend="${page.isLast()?'pointer-events-none text-gray-200 dark:text-gray-700':'text-gray-400 hover:bg-gray-50 dark:hover:bg-white/5'}"
                   th:aria-disabled="${page.isLast()}">
                    <span class="sr-only" th:text="#{pagination.next}">Next</span>
                    <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true" class="size-5">
                        <path d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
                              clip-rule="evenodd" fill-rule="evenodd"/>
                    </svg>
                </a>
            </nav>
        </div>
    </div>
</div>

</body>
</html>
