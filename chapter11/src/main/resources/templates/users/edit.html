<!-- tag::full[] -->
<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout}"
        th:with="activeMenuItem='users'">

<head>
    <title>Users</title>
</head>
<body>
<div layout:fragment="page-content">
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white"
        th:text="#{user.create}">Create user</h1>
    <div class="mt-8 bg-white shadow-xs outline outline-gray-900/5 sm:rounded-xl dark:bg-gray-800/50 dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
        <form id="user-form"
              th:object="${user}"
              th:action="@{/users/create}"
              method="post">
            <div class="px-4 py-6 sm:p-8">
                <div th:replace="~{fragments/forms :: fielderrors}"></div>
                <div class="grid max-w-2xl grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                    <!-- tag::gender[] -->
                    <fieldset class="sm:col-span-6">
                        <legend class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                                th:text="#{user.gender}">
                            Gender
                        </legend>
                        <div class="mt-2 space-y-4 sm:flex sm:items-center sm:space-y-0 sm:space-x-10">
                            <div th:each="possibleGender : ${genders}"
                                 class="flex items-center">
                                <input type="radio"
                                       th:id="${'gender-'+possibleGender}"
                                       th:field="*{gender}"
                                       th:value="${possibleGender}"
                                       class="relative size-4 appearance-none rounded-full border border-gray-300 bg-white before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden checked:border-green-600 checked:bg-green-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600 disabled:border-gray-300 disabled:bg-gray-100 disabled:before:bg-gray-400 dark:border-white/10 dark:bg-white/5 dark:checked:border-green-500 dark:checked:bg-green-500 dark:focus-visible:outline-green-500 dark:disabled:border-white/5 dark:disabled:bg-white/10 dark:disabled:before:bg-white/20 forced-colors:appearance-auto forced-colors:before:hidden">
                                <label th:for="${'gender-'+possibleGender}"
                                       th:text="#{'Gender.'+${possibleGender}}"
                                       class="ml-3 block text-sm/6 font-medium text-gray-900 dark:text-white">
                                </label>
                            </div>
                        </div>
                        <p th:if="${#fields.hasErrors('gender')}"
                           th:text="${#strings.listJoin(#fields.errors('gender'), ', ')}"
                           class="mt-2 text-sm text-red-600 dark:text-red-400" id="gender-error">Gender validation error message(s).</p>
                    </fieldset>
                    <!-- end::gender[] -->

                    <!-- tag::firstname[] -->
                    <div class="sm:col-span-3">
                        <label for="firstName" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                               th:text="#{user.firstName}">
                            First name
                        </label>
                        <div class="mt-2 grid grid-cols-1">
                            <input id="firstName"
                                   type="text"
                                   th:field="*{firstName}"
                                   class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pl-3 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2 sm:text-sm/6 dark:bg-white/5"
                                   th:classappend="${#fields.hasErrors('firstName')?'pr-10 text-red-900 outline-red-300 placeholder:text-red-300 focus:outline-red-600 sm:pr-9 dark:text-red-400 dark:outline-red-500/50 dark:placeholder:text-red-400/70 dark:focus:outline-red-400':'pr-3 text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-green-600 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-green-500'}">
                            <svg th:if="${#fields.hasErrors('firstName')}"
                                 viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true"
                                 class="pointer-events-none col-start-1 row-start-1 mr-3 size-5 self-center justify-self-end text-red-500 sm:size-4 dark:text-red-400">
                                <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                                      clip-rule="evenodd" fill-rule="evenodd"/>
                            </svg>
                        </div>
                        <p th:if="${#fields.hasErrors('firstName')}"
                           th:text="${#strings.listJoin(#fields.errors('firstName'), ', ')}"
                           class="mt-2 text-sm text-red-600 dark:text-red-400" id="firstName-error">First name validation error message(s).</p>
                    </div>
                    <!-- end::firstname[] -->

                    <div class="sm:col-span-3">
                        <label for="lastName" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                               th:text="#{user.lastName}">
                            Last name
                        </label>
                        <div class="mt-2 grid grid-cols-1">
                            <input id="lastName"
                                   type="text"
                                   th:field="*{lastName}"
                                   class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pl-3 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2 sm:text-sm/6 dark:bg-white/5"
                                   th:classappend="${#fields.hasErrors('lastName')?'pr-10 text-red-900 outline-red-300 placeholder:text-red-300 focus:outline-red-600 sm:pr-9 dark:text-red-400 dark:outline-red-500/50 dark:placeholder:text-red-400/70 dark:focus:outline-red-400':'pr-3 text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-green-600 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-green-500'}">
                            <svg th:if="${#fields.hasErrors('lastName')}"
                                 viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true"
                                 class="pointer-events-none col-start-1 row-start-1 mr-3 size-5 self-center justify-self-end text-red-500 sm:size-4 dark:text-red-400">
                                <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                                      clip-rule="evenodd" fill-rule="evenodd"/>
                            </svg>
                        </div>
                        <p th:if="${#fields.hasErrors('lastName')}"
                           th:text="${#strings.listJoin(#fields.errors('lastName'), ', ')}"
                           class="mt-2 text-sm text-red-600 dark:text-red-400" id="lastName-error">Last name validation error message(s).</p>
                    </div>

                    <div class="sm:col-span-4">
                        <label for="email" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                               th:text="#{user.email}">
                            Email address
                        </label>
                        <div class="mt-2 grid grid-cols-1">
                            <input id="email"
                                   type="email"
                                   th:field="*{email}"
                                   class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pl-3 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2 sm:text-sm/6 dark:bg-white/5"
                                   th:classappend="${#fields.hasErrors('email')?'pr-10 text-red-900 outline-red-300 placeholder:text-red-300 focus:outline-red-600 sm:pr-9 dark:text-red-400 dark:outline-red-500/50 dark:placeholder:text-red-400/70 dark:focus:outline-red-400':'pr-3 text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-green-600 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-green-500'}">
                            <svg th:if="${#fields.hasErrors('email')}"
                                 viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true"
                                 class="pointer-events-none col-start-1 row-start-1 mr-3 size-5 self-center justify-self-end text-red-500 sm:size-4 dark:text-red-400">
                                <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                                      clip-rule="evenodd" fill-rule="evenodd"/>
                            </svg>
                        </div>
                        <p th:if="${#fields.hasErrors('email')}"
                           th:text="${#strings.listJoin(#fields.errors('email'), ', ')}"
                           class="mt-2 text-sm text-red-600 dark:text-red-400" id="email-error">Email validation error message(s).</p>
                    </div>

                    <!-- tag::phoneNumber[] -->
                    <div class="sm:col-span-4">
                        <label for="phoneNumber" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                               th:text="#{user.phoneNumber}">
                            Phone number
                        </label>
                        <div class="mt-2 grid grid-cols-1">
                            <input id="phoneNumber"
                                   type="text"
                                   th:field="*{phoneNumber}"
                                   class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pl-3 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2 sm:text-sm/6 dark:bg-white/5"
                                   th:classappend="${#fields.hasErrors('phoneNumber')?'pr-10 text-red-900 outline-red-300 placeholder:text-red-300 focus:outline-red-600 sm:pr-9 dark:text-red-400 dark:outline-red-500/50 dark:placeholder:text-red-400/70 dark:focus:outline-red-400':'pr-3 text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-green-600 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-green-500'}">
                            <svg th:if="${#fields.hasErrors('phoneNumber')}"
                                 viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true"
                                 class="pointer-events-none col-start-1 row-start-1 mr-3 size-5 self-center justify-self-end text-red-500 sm:size-4 dark:text-red-400">
                                <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                                      clip-rule="evenodd" fill-rule="evenodd"/>
                            </svg>
                        </div>
                        <p th:if="${#fields.hasErrors('phoneNumber')}"
                           th:text="${#strings.listJoin(#fields.errors('phoneNumber'), ', ')}"
                           class="mt-2 text-sm text-red-600 dark:text-red-400" id="phoneNumber-error">Phone number validation error message(s).</p>
                    </div>
                    <!-- end::phoneNumber[] -->

                    <!-- tag::birthday[] -->
                    <div class="sm:col-span-2 sm:col-start-1">
                        <label for="birthday" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                               th:text="#{user.birthday}">
                            Birthday
                        </label>
                        <div class="mt-2 grid grid-cols-1">
                            <input id="birthday"
                                   type="text"
                                   th:field="*{birthday}"
                                   th:placeholder="#{user.birthday.placeholder}"
                                   class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pl-3 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2 sm:text-sm/6 dark:bg-white/5"
                                   th:classappend="${#fields.hasErrors('birthday')?'pr-10 text-red-900 outline-red-300 placeholder:text-red-300 focus:outline-red-600 sm:pr-9 dark:text-red-400 dark:outline-red-500/50 dark:placeholder:text-red-400/70 dark:focus:outline-red-400':'pr-3 text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-green-600 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-green-500'}">
                            <svg th:if="${#fields.hasErrors('birthday')}"
                                 viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true"
                                 class="pointer-events-none col-start-1 row-start-1 mr-3 size-5 self-center justify-self-end text-red-500 sm:size-4 dark:text-red-400">
                                <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                                      clip-rule="evenodd" fill-rule="evenodd"/>
                            </svg>
                        </div>
                        <p th:if="${#fields.hasErrors('birthday')}"
                           th:text="${#strings.listJoin(#fields.errors('birthday'), ', ')}"
                           class="mt-2 text-sm text-red-600 dark:text-red-400" id="birthday-error">Birthday validation error message(s).</p>
                    </div>
                    <!-- end::birthday[] -->
                </div>
            </div>
            <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8 dark:border-white/10">
                <button type="button"
                        class="text-sm/6 font-semibold text-gray-900 dark:text-white"
                        th:text="#{cancel}">
                    Cancel
                </button>
                <button type="submit"
                        class="rounded-md bg-green-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-green-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600 dark:bg-green-500 dark:shadow-none dark:hover:bg-green-400 dark:focus-visible:outline-green-500"
                        th:text="#{save}">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
<!-- end::full[] -->
