<!-- tag::full[] -->
<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout}"
        th:with="activeMenuItem='users'">

<head>
    <title>Users</title>
</head>
<body>
<div layout:fragment="page-content">
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white"
        th:text="${editMode?.name() == 'UPDATE'}?#{user.edit}:#{user.create}">Create user</h1>
    <div class="mt-8 bg-white shadow-xs outline outline-gray-900/5 sm:rounded-xl dark:bg-gray-800/50 dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
        <form id="user-form"
              th:object="${user}"
              th:action="${editMode?.name() == 'UPDATE'}?@{/users/{id}(id=${user.id})}:@{/users/create}"
              method="post"
              enctype="multipart/form-data">
            <div class="px-4 py-6 sm:p-8">
                <div th:replace="~{fragments/forms :: fielderrors}"></div>
                <div class="grid max-w-2xl grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                    <input type="hidden" th:field="*{version}" th:if="${editMode?.name() == 'UPDATE'}">
                    <!-- tag::avatar[] -->
                    <div class="col-span-full flex flex-col items-center gap-4 sm:flex-row">
                        <img id="avatarImage"
                             th:src="${editMode?.name() == 'UPDATE' && user.avatarBase64Encoded != null}?${'data:image/jpeg;base64,' + user.avatarBase64Encoded}:@{/svg/user.svg}"
                             alt=""
                             class="size-32 cursor-pointer rounded-full bg-gray-100 object-cover outline -outline-offset-1 outline-black/5 dark:bg-white/10 dark:outline-white/10"
                             th:classappend="${editMode?.name() == 'UPDATE' && user.avatarBase64Encoded != null}?'':'p-6'"> <!--.-->
                        <input id="avatarFile" type="file" name="avatarFile" accept="image/*" class="hidden"> <!--.-->
                        <button id="selectAvatarButton"
                                type="button"
                                class="rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20"
                                th:text="#{user.avatar.add}">Add picture
                        </button> <!--.-->
                    </div>
                    <!-- end::avatar[] -->
                    <!-- tag::userRole[] -->
                    <div class="sm:col-span-3">
                        <label for="userRole" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                               th:text="#{user.role}">User role</label>
                        <div class="mt-2 grid grid-cols-1">
                            <select id="userRole"
                                    th:field="*{userRole}"
                                    class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-green-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:*:bg-gray-800 dark:focus-visible:outline-green-500"> <!--.-->
                                <option th:each="role : ${possibleRoles}"
                                        th:text="#{'UserRole.' + ${role.name()}}"
                                        th:value="${role.name()}">User
                                </option> <!--.-->
                            </select>
                            <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4 dark:text-gray-400">
                                <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd"/>
                            </svg>
                        </div>
                    </div>
                    <!-- end::userRole[] -->
                    <!-- tag::gender[] -->
                    <fieldset class="sm:col-span-6">
                        <legend class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                                th:text="#{user.gender}">
                            Gender
                        </legend>
                        <div class="mt-2 space-y-4 sm:flex sm:items-center sm:space-y-0 sm:space-x-10">
                            <div th:each="possibleGender : ${genders}"
                                 class="flex items-center">
                                <input type="radio"
                                       th:id="${'gender-'+possibleGender}"
                                       th:field="*{gender}"
                                       th:value="${possibleGender}"
                                       class="relative size-4 appearance-none rounded-full border border-gray-300 bg-white before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden checked:border-green-600 checked:bg-green-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600 disabled:border-gray-300 disabled:bg-gray-100 disabled:before:bg-gray-400 dark:border-white/10 dark:bg-white/5 dark:checked:border-green-500 dark:checked:bg-green-500 dark:focus-visible:outline-green-500 dark:disabled:border-white/5 dark:disabled:bg-white/10 dark:disabled:before:bg-white/20 forced-colors:appearance-auto forced-colors:before:hidden">
                                <label th:for="${'gender-'+possibleGender}"
                                       th:text="#{'Gender.'+${possibleGender}}"
                                       class="ml-3 block text-sm/6 font-medium text-gray-900 dark:text-white">
                                </label>
                            </div>
                        </div>
                        <p th:if="${#fields.hasErrors('gender')}"
                           th:text="${#strings.listJoin(#fields.errors('gender'), ', ')}"
                           class="mt-2 text-sm text-red-600 dark:text-red-400" id="gender-error">Gender validation error message(s).</p>
                    </fieldset>
                    <!-- end::gender[] -->

                    <!-- tag::textinputs[] -->
                    <div th:replace="~{fragments/forms :: textinput(#{user.firstName}, 'firstName', 'sm:col-span-3')}"></div>
                    <div th:replace="~{fragments/forms :: textinput(#{user.lastName}, 'lastName', 'sm:col-span-3')}"></div>
                    <div th:replace="~{fragments/forms :: textinput(labelText=#{user.email}, fieldName='email', cssClass='sm:col-span-4', inputType='email')}"></div>
                    <th:block th:if="${editMode?.name() == 'CREATE'}">
                        <div th:replace="~{fragments/forms :: textinput(labelText=#{user.password}, fieldName='password', cssClass='sm:col-span-4', inputType='password')}"></div>
                        <div th:replace="~{fragments/forms :: textinput(labelText=#{user.password.repeated}, fieldName='passwordRepeated', cssClass='sm:col-span-4', inputType='password')}"></div>
                    </th:block>
                    <div th:replace="~{fragments/forms :: textinput(#{user.phoneNumber}, 'phoneNumber', 'sm:col-span-4')}"></div>
                    <div th:replace="~{fragments/forms :: dateinput(labelText=#{user.birthday}, fieldName='birthday', cssClass='sm:col-span-3 sm:col-start-1')}"></div>
                    <!-- end::textinputs[] -->
                </div>
            </div>
            <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8 dark:border-white/10">
                <button type="button"
                        class="text-sm/6 font-semibold text-gray-900 dark:text-white"
                        th:text="#{cancel}">
                    Cancel
                </button>
                <!-- tag::submit-button[] -->
                <button id="submit-button"
                        type="submit"
                        class="rounded-md bg-green-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-green-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600 dark:bg-green-500 dark:shadow-none dark:hover:bg-green-400 dark:focus-visible:outline-green-500"
                        th:text="${editMode?.name() == 'UPDATE'}?#{save}:#{create}">
                    Save
                </button>
                <!-- end::submit-button[] -->
            </div>
        </form>
    </div>
</div>
<!-- tag::avatar-js[] -->
<th:block layout:fragment="page-scripts">
    <script>
        document.querySelector('#selectAvatarButton').addEventListener('click', evt => { // <.>
            document.querySelector('#selectAvatarButton').blur();
            document.querySelector('#avatarFile').click();
        });

        document.querySelector('#avatarImage').addEventListener('click', evt => { // <.>
            document.querySelector('#avatarImage').blur();
            document.querySelector('#avatarFile').click();
        });

        document.querySelector('#avatarFile').addEventListener('change', evt => { // <.>
            previewImage();
        });

        function previewImage() {
            const uploader = document.querySelector('#avatarFile');
            if (uploader.files && uploader.files[0]) {
                document.querySelector('#avatarImage').src = window.URL.createObjectURL(uploader.files[0]); // <.>
                document.querySelector('#avatarImage').classList.remove('p-6'); //<.>
            }
        }
    </script>
</th:block>
<!-- end::avatar-js[] -->
</body>
</html>
<!-- end::full[] -->
