<html xmlns:th="http://www.thymeleaf.org"
>
<!--/*@thymesVar id="link" type="java.lang.String"*/-->
<!--/*@thymesVar id="title" type="java.lang.String"*/-->
<!--/*@thymesVar id="menuItem" type="java.lang.String"*/-->
<!--/*@thymesVar id="activeMenuItem" type="java.lang.String"*/-->

<!-- tag::mobile-button[] -->
<a th:fragment="mobile-button(link, title, menuItem, icon)"
   th:href="${link}"
   class="group flex items-center rounded-md px-2 py-2 text-sm font-medium"
   th:classappend="${activeMenuItem == menuItem}? 'bg-gray-50 text-indigo-600 dark:bg-white/5 dark:text-white' : 'text-gray-700 hover:bg-gray-50 hover:text-indigo-600 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white'"
>
    <div class="mr-4 h-6 w-6 flex-shrink-0"
         th:classappend="${activeMenuItem == menuItem}?'text-indigo-600 dark:text-white':'text-gray-400 group-hover:text-indigo-600 dark:group-hover:text-white'">
        <svg th:replace="~{${icon}}"></svg>
    </div>
    [[${title}]]
</a>
<!-- end::mobile-button[] -->

<!-- tag::desktop-button[] -->
<a th:fragment="desktop-button(link, title, menuItem, icon)"
   th:href="${link}"
   class="group flex items-center rounded-md px-2 py-2 text-sm font-medium"
   th:classappend="${activeMenuItem == menuItem} ? 'bg-gray-50 text-indigo-600 dark:bg-white/5 dark:text-white' : 'text-gray-700 hover:bg-gray-50 hover:text-indigo-600 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white'"
>
    <div class="mr-3 h-6 w-6 flex-shrink-0"
         th:classappend="${activeMenuItem == menuItem}?'text-indigo-600 dark:text-white':'text-gray-400 group-hover:text-indigo-600 dark:group-hover:text-white'">
        <svg th:replace="~{${icon}}"></svg>
    </div>
    [[${title}]]
</a>
<!-- end::desktop-button[] -->

</html>
