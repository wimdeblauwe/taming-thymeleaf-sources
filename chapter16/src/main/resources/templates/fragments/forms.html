<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<!-- tag::textinput[] -->
<div th:fragment="textinput(labelText, fieldName, cssClass)"
     th:with="inputType=${inputType?:'text'},placeholder=${placeholder?:''}"
     th:class="${cssClass}">
    <label th:for="${fieldName}" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
           th:text="${labelText}">
        Text input label
    </label>
    <div class="mt-2 grid grid-cols-1">
        <input th:id="${fieldName}"
               th:type="${inputType}"
               th:placeholder="${placeholder}"
               th:field="*{__${fieldName}__}"
               class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pl-3 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2 sm:text-sm/6 dark:bg-white/5"
               th:classappend="${#fields.hasErrors('__${fieldName}__')?'pr-10 text-red-900 outline-red-300 placeholder:text-red-300 focus:outline-red-600 sm:pr-9 dark:text-red-400 dark:outline-red-500/50 dark:placeholder:text-red-400/70 dark:focus:outline-red-400':'pr-3 text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-green-600 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-green-500'}">
        <svg th:if="${#fields.hasErrors('__${fieldName}__')}"
             viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true"
             class="pointer-events-none col-start-1 row-start-1 mr-3 size-5 self-center justify-self-end text-red-500 sm:size-4 dark:text-red-400">
            <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                  clip-rule="evenodd" fill-rule="evenodd"/>
        </svg>
    </div>
    <p th:if="${#fields.hasErrors('__${fieldName}__')}"
       th:text="${#strings.listJoin(#fields.errors('__${fieldName}__'), ', ')}"
       class="mt-2 text-sm text-red-600 dark:text-red-400" th:id="'__${fieldName}__'+ '-error'">Field validation error message(s).</p>
</div>
<!-- end::textinput[] -->
<!-- tag::dateinput[] -->
<div th:fragment="dateinput(labelText, fieldName, cssClass)"
     th:with="placeholder=${placeholder?:''}"
     th:class="${cssClass}">
    <label th:for="${fieldName}" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
           th:text="${labelText}">
        Date input label
    </label>
    <div class="mt-2 flex gap-x-2" data-date-picker>
        <input type="hidden"
               th:id="${fieldName + '-value'}"
               th:field="*{__${fieldName}__}"> <!--.-->
        <div class="grid grow grid-cols-1">
            <input th:id="${fieldName}"
                   type="text"
                   readonly
                   th:placeholder="${placeholder}"
                   class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pl-3 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2 sm:text-sm/6 dark:bg-white/5"
                   th:classappend="${#fields.hasErrors('__${fieldName}__')?'pr-10 text-red-900 outline-red-300 placeholder:text-red-300 focus:outline-red-600 sm:pr-9 dark:text-red-400 dark:outline-red-500/50 dark:placeholder:text-red-400/70 dark:focus:outline-red-400':'pr-3 text-gray-900 outline-gray-300 placeholder:text-gray-400 focus:outline-green-600 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-green-500'}">
            <svg th:if="${#fields.hasErrors('__${fieldName}__')}"
                 viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true"
                 class="pointer-events-none col-start-1 row-start-1 mr-3 size-5 self-center justify-self-end text-red-500 sm:size-4 dark:text-red-400">
                <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                      clip-rule="evenodd" fill-rule="evenodd"/>
            </svg>
        </div>
        <button type="button"
                th:popovertarget="${fieldName + '-calendar'}"
                class="shrink-0 cursor-pointer rounded-md bg-white px-2.5 text-gray-500 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 hover:text-gray-700 dark:bg-white/10 dark:text-gray-300 dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20 dark:hover:text-white">
            <span class="sr-only">Open calendar</span>
            <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true" class="size-5">
                <path fill-rule="evenodd" d="M5.75 2a.75.75 0 0 1 .75.75V4h7V2.75a.75.75 0 0 1 1.5 0V4h.25A2.75 2.75 0 0 1 18 6.75v8.5A2.75 2.75 0 0 1 15.25 18H4.75A2.75 2.75 0 0 1 2 15.25v-8.5A2.75 2.75 0 0 1 4.75 4H5V2.75A.75.75 0 0 1 5.75 2Zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75Z" clip-rule="evenodd"/>
            </svg>
        </button>
        <el-popover th:id="${fieldName + '-calendar'}"
                    anchor="bottom end"
                    popover
                    class="rounded-lg bg-white p-4 text-gray-900 shadow-lg max-sm:w-[calc(100vw-4rem)]! outline-1 outline-black/5 transition transition-discrete [--anchor-gap:--spacing(2)] data-closed:scale-95 data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in dark:bg-gray-800 dark:text-white dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
            <calendar-date th:value="*{__${fieldName}__}"
                           th:locale="${#locale.toLanguageTag()}"> <!--.-->
                <svg slot="previous" aria-label="Previous" viewBox="0 0 20 20" fill="currentColor" class="size-5">
                    <path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/>
                </svg>
                <svg slot="next" aria-label="Next" viewBox="0 0 20 20" fill="currentColor" class="size-5">
                    <path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
                </svg>
                <calendar-month></calendar-month>
            </calendar-date>
        </el-popover>
    </div>
    <p th:if="${#fields.hasErrors('__${fieldName}__')}"
       th:text="${#strings.listJoin(#fields.errors('__${fieldName}__'), ', ')}"
       class="mt-2 text-sm text-red-600 dark:text-red-400" th:id="'__${fieldName}__'+ '-error'">Field validation error message(s).</p>
</div>
<!-- end::dateinput[] -->
<div th:fragment="fielderrors"
     class="mb-8 rounded-md bg-red-50 p-4 dark:bg-red-500/15 dark:outline dark:outline-red-500/25"
     th:if="${#fields.hasErrors()}"> <!--.-->
    <div class="flex">
        <div class="shrink-0">
            <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true" class="size-5 text-red-400">
                <path d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM8.28 7.22a.75.75 0 0 0-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 1 0 1.06 1.06L10 11.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L11.06 10l1.72-1.72a.75.75 0 0 0-1.06-1.06L10 8.94 8.28 7.22Z"
                      clip-rule="evenodd" fill-rule="evenodd"/>
            </svg>
        </div>
        <div class="ml-3">
            <h3 class="text-sm font-medium text-red-800 dark:text-red-200"
                th:text="#{error.messages.summary.title(${#fields.errors().size()})}"> <!--.-->
                There were 2 errors with your submission
            </h3>
            <div class="mt-2 text-sm text-red-700 dark:text-red-200/80">
                <ul role="list" class="list-disc space-y-1 pl-5">
                    <li th:each="err : ${#fields.errors()}" th:text="${err}"></li> <!--.-->
                </ul>
            </div>
        </div>
    </div>
</div>
</html>
