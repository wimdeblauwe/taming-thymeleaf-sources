<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<div th:fragment="title-with-button(title, buttonIcon, buttonText, buttonLink, buttonId)"
     class="md:flex md:items-center md:justify-between"> <!--.-->
    <div class="min-w-0 flex-1">
        <h1 class="text-2xl font-semibold text-gray-900 dark:text-white"
            th:text="${title}">Title</h1> <!--.-->
    </div>
    <div class="mt-4 flex md:mt-0 md:ml-4">
        <a th:href="${buttonLink}"
           th:id="${buttonId}"
           class="inline-flex items-center gap-x-1.5 rounded-md bg-green-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-green-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600 dark:bg-green-500 dark:shadow-none dark:hover:bg-green-400 dark:focus-visible:outline-green-500"> <!--.-->
            <svg th:replace="~{${buttonIcon}}"></svg> <!--.-->
            [[${buttonText}]] <!--.-->
        </a>
    </div>
</div>
</html>
