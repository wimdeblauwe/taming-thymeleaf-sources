<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        layout:decorate="~{layout/layout}"
        th:with="activeMenuItem='teams'">
<head>
    <title>Teams</title>
</head>
<body>
<div layout:fragment="page-content">
    <div th:replace="~{fragments/titles :: title-with-button(#{teams.title}, 'user-add', #{teams.add}, @{/teams/create}, 'add-team-button')}"
         sec:authorize="hasRole('ADMIN')"></div>
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white"
        th:text="#{teams.title}"
        sec:authorize="!hasRole('ADMIN')">Teams</h1>
    <div th:if="${deletedTeamName}">
        <div th:replace="~{fragments/alerts :: success(#{team.delete.success(${deletedTeamName})})}"></div>
    </div>
    <div class="mt-8 flow-root">
        <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
            <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
                <div class="overflow-hidden shadow-sm outline-1 outline-black/5 sm:rounded-lg dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
                    <table id="teams-table" class="relative min-w-full divide-y divide-gray-300 dark:divide-white/15">
                        <thead class="bg-gray-50 dark:bg-gray-800/75">
                        <tr>
                            <th th:replace="~{fragments/table :: header(#{team.name})}"></th>
                            <th th:replace="~{fragments/table :: header(title=#{team.coach},hideOnMobile=true)}"></th>
                            <th:block sec:authorize="hasRole('ADMIN')">
                                <th th:replace="~{fragments/table :: header('')}"></th>
                                <th th:replace="~{fragments/table :: header('')}"></th>
                            </th:block>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200 bg-white dark:divide-white/10 dark:bg-gray-800/50">
                        <tr th:each="team : ${teams}">
                            <td th:replace="~{fragments/table :: data(contents=${team.name},primary=true)}"></td>
                            <td th:replace="~{fragments/table :: data(contents=${team.coachName.fullName},hideOnMobile=true)}"></td>
                            <th:block sec:authorize="hasRole('ADMIN')">
                                <td th:replace="~{fragments/table :: dataWithLink(#{edit}, @{/teams/{id}(id=${team.id.asString()})})}"></td>
                                <td th:x-data="|{name: '${#strings.escapeJavaScript(team.name)}', deleteUrl: '/teams/${team.id.asString()}/delete'}|"
                                    class="py-4 pr-4 pl-3 text-right text-sm font-medium whitespace-nowrap sm:pr-6">
                                    <button type="button"
                                            th:id="|delete-link-${team.id.asString()}|"
                                            command="show-modal" commandfor="delete-team-dialog"
                                            @click="$dispatch('open-delete-modal', {name, deleteUrl})"
                                            class="cursor-pointer text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300">Delete</button>
                                </td>
                            </th:block>
                        </tr>
                        </tbody>
                    </table>
                    <div th:replace="~{fragments/pagination :: controls(page=${teams})}"></div>
                </div>
            </div>
        </div>
    </div>
    <div x-data="modalDeleteConfirmation()"
         @open-delete-modal.window="showModal($event)">
        <el-dialog>
            <dialog id="delete-team-dialog" aria-labelledby="delete-team-dialog-title"
                    class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
                <el-dialog-backdrop class="fixed inset-0 bg-gray-500/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in dark:bg-gray-900/50"></el-dialog-backdrop>

                <div tabindex="0" class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
                    <el-dialog-panel class="relative transform overflow-hidden rounded-lg bg-white px-4 pt-5 pb-4 text-left shadow-xl transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:w-full sm:max-w-lg sm:p-6 data-closed:sm:translate-y-0 data-closed:sm:scale-95 dark:bg-gray-800 dark:outline dark:-outline-offset-1 dark:outline-white/10">
                        <div class="sm:flex sm:items-start">
                            <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-red-100 sm:mx-0 sm:size-10 dark:bg-red-500/10">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6 text-red-600 dark:text-red-400">
                                    <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                                <h3 id="delete-team-dialog-title" class="text-base font-semibold text-gray-900 dark:text-white">Delete team</h3>
                                <div class="mt-2">
                                    <p id="delete-modal-message" class="text-sm text-gray-500 dark:text-gray-400">
                                        Are you sure you want to delete team <span class="italic" x-text="name"></span>?
                                    </p>
                                </div>
                            </div>
                        </div>
                        <form id="deleteForm" method="post"
                              x-bind:action="deleteUrl">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <div class="mt-5 sm:mt-4 sm:flex sm:flex-row-reverse">
                                <button type="submit"
                                        id="delete-modal-submit-button"
                                        class="inline-flex w-full justify-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-red-500 sm:ml-3 sm:w-auto dark:bg-red-500 dark:shadow-none dark:hover:bg-red-400">
                                    Delete
                                </button>
                                <button type="button"
                                        command="close" commandfor="delete-team-dialog"
                                        class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </el-dialog-panel>
                </div>
            </dialog>
        </el-dialog>
    </div>
</div>
<th:block layout:fragment="page-scripts">
    <script>
        function modalDeleteConfirmation() {
            return {
                name: '',
                deleteUrl: '',
                showModal($event) {
                    this.name = $event.detail.name;
                    this.deleteUrl = $event.detail.deleteUrl;
                }
            };
        }
    </script>
    <script th:replace="~{fragments/alerts :: alert-js}"></script>
</th:block>
</body>
</html>
