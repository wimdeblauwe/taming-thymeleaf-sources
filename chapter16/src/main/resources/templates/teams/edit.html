<!-- tag::full[] -->
<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout}"
        th:with="activeMenuItem='teams'">

<head>
    <title>Teams</title>
</head>
<body>
<div layout:fragment="page-content">
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white"
        th:text="${editMode?.name() == 'UPDATE'}?#{team.edit}:#{team.create}">Create team</h1>
    <div class="mt-8 bg-white shadow-xs outline outline-gray-900/5 sm:rounded-xl dark:bg-gray-800/50 dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
        <form id="team-form"
              th:object="${team}"
              th:action="${editMode?.name() == 'UPDATE'}?@{/teams/{id}(id=${team.id})}:@{/teams/create}"
              method="post">
            <div class="px-4 py-6 sm:p-8">
                <div th:replace="~{fragments/forms :: fielderrors}"></div>
                <div class="grid max-w-2xl grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                    <input type="hidden" th:field="*{version}" th:if="${editMode?.name() == 'UPDATE'}">

                    <div th:replace="~{fragments/forms :: textinput(#{team.name}, 'name', 'sm:col-span-3')}"></div>
                    <!-- tag::coach-select[] -->
                    <div class="sm:col-span-3">
                        <label for="coachId" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                               th:text="#{team.coach}">Coach</label>
                        <div class="mt-2 grid grid-cols-1">
                            <select th:field="*{coachId}"
                                    class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-green-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:*:bg-gray-800 dark:focus-visible:outline-green-500">
                                <option th:each="user : ${users}"
                                        th:text="${user.userName.fullName}"
                                        th:value="${user.id.asString()}">
                                </option>
                            </select>
                            <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4 dark:text-gray-400">
                                <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd"/>
                            </svg>
                        </div>
                    </div>
                    <!-- end::coach-select[] -->
                    <!-- tag::players[] -->
                    <div class="col-span-full">
                        <h3 class="text-sm/6 font-medium text-gray-900 dark:text-white">Players</h3>
                        <div id="teamplayer-forms" class="mt-2 space-y-4"
                             th:data-teamplayers-count="${team.players.length}"> <!--.-->
                            <th:block th:each="player, iter : ${team.players}">
                                <div th:replace="~{teams/edit-teamplayer-fragment :: teamplayer-form(index=${iter.index}, teamObjectName='team')}"></div> <!--.-->
                            </th:block>
                        </div>
                        <div class="mt-4">
                            <button id="add-extra-teamplayer-form-button"
                                    type="button"
                                    class="rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20"
                                    th:text="#{team.player.add.extra}"
                                    onclick="addExtraTeamPlayerForm()">Add
                            </button> <!--.-->
                        </div>
                    </div>
                    <!-- end::players[] -->
                </div>
            </div>
            <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8 dark:border-white/10">
                <button type="button"
                        class="text-sm/6 font-semibold text-gray-900 dark:text-white"
                        th:text="#{cancel}">
                    Cancel
                </button>
                <button id="submit-button"
                        type="submit"
                        class="rounded-md bg-green-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-green-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600 dark:bg-green-500 dark:shadow-none dark:hover:bg-green-400 dark:focus-visible:outline-green-500"
                        th:text="${editMode?.name() == 'UPDATE'}?#{save}:#{create}">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>
<!-- tag::page-scripts[] -->
<th:block layout:fragment="page-scripts">
    <script>
        function addExtraTeamPlayerForm() { // <.>
            const teamPlayerForms = document.getElementById('teamplayer-forms'); // <.>
            const count = teamPlayerForms.getAttribute('data-teamplayers-count'); // <.>
            fetch(`/teams/edit-teamplayer-fragment?index=${count}`) // <.>
                    .then(response => response.text()) // <.>
                    .then(fragment => {
                        teamPlayerForms.appendChild(htmlToElement(fragment)); // <.>
                        teamPlayerForms.setAttribute('data-teamplayers-count', parseInt(count) + 1); // <.>
                    });
        }

        // tag::removeTeamPlayerForm[]
        function removeTeamPlayerForm(formIndex) {
            const teamplayerForm = document.getElementById('teamplayer-form-section-' + formIndex);
            teamplayerForm.parentElement.removeChild(teamplayerForm);
        }
        // end::removeTeamPlayerForm[]

        function htmlToElement(html) {
            const template = document.createElement('template');
            html = html.trim(); // Never return a text node of whitespace as the result
            template.innerHTML = html;
            return template.content.firstChild;
        }
    </script>
</th:block>
<!-- end::page-scripts[] -->
</body>
</html>
<!-- end::full[] -->
