<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<!-- tag::main[] -->
<div th:fragment="teamplayer-form"
     class="flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-4"
     th:id="${'teamplayer-form-section-' + __${index}__}"
     th:object="${__${teamObjectName}__}"> <!--.-->
    <!-- end::main[] -->
    <div class="grid grid-cols-1 sm:flex-1">
        <select th:field="*{players[__${index}__].playerId}"
                class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-green-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:*:bg-gray-800 dark:focus-visible:outline-green-500"> <!--.-->
            <option th:each="user : ${users}"
                    th:text="${user.userName.fullName}"
                    th:value="${user.id.asString()}">
            </option>
        </select>
        <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4 dark:text-gray-400">
            <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd"/>
        </svg>
    </div>
    <div class="grid grid-cols-1 sm:flex-1">
        <select th:field="*{players[__${index}__].position}"
                class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-green-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:*:bg-gray-800 dark:focus-visible:outline-green-500"> <!--.-->
            <option th:each="position : ${positions}"
                    th:text="#{'PlayerPosition.' + ${position}}"
                    th:value="${position}">
            </option>
        </select>
        <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4 dark:text-gray-400">
            <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd"/>
        </svg>
    </div>
    <!-- tag::delete[] -->
    <button type="button"
            class="inline-flex cursor-pointer items-center gap-x-1.5 self-start text-sm font-semibold text-red-600 hover:text-red-500 sm:self-center dark:text-red-400 dark:hover:text-red-300"
            th:data-formindex="${index}"
            onclick="removeTeamPlayerForm(this.dataset.formindex)"> <!--.-->
        <svg th:replace="~{trash}"></svg>
        <span th:text="#{team.player.remove}">Remove</span>
    </button>
    <!-- end::delete[] -->
</div>
</html>
