<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en"
      class="h-full bg-white dark:bg-gray-900">
<head>
    <meta charset="UTF-8">
    <title>Taming Thymeleaf</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <link rel="stylesheet" href="https://rsms.me/inter/inter.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <vite:client></vite:client>
    <vite:vite>
        <vite:entry value="/css/application.css"></vite:entry>
    </vite:vite>
</head>
<!-- tag::body[] -->
<body class="h-full">
<!-- Off-canvas menu for mobile -->
<div th:replace="~{fragments/sidebar-menu :: mobile}"></div> <!--1-->

<!-- Static sidebar for desktop -->
<div th:replace="~{fragments/sidebar-menu :: desktop}"></div> <!--2-->

<div class="lg:pl-72">
    <div th:replace="~{fragments/top-menu :: menu}"></div> <!--3-->

    <main class="py-10">
        <div class="px-4 sm:px-6 lg:px-8">
            <!-- Your content -->
        </div>
    </main>
</div>
</body>
<!-- end::body[] -->
</html>
