<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<body>
<table>
    <thead>
    <tr>
        <!-- tag::th[] -->
        <th th:fragment="header(title)"
            th:with="hideOnMobile=${hideOnMobile?:false}"
            scope="col"
            class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 first:pl-4 last:pr-4 sm:first:pl-6 sm:last:pr-6 dark:text-gray-200"
            th:classappend="${hideOnMobile?'hidden sm:table-cell':''}"
            th:text="${title}">
            Header title
        </th>
        <!-- end::th[] -->
    </tr>
    </thead>
    <tbody>
    <tr>
        <!-- tag::td[] -->
        <td th:fragment="data(contents)"
            th:with="primary=${primary?: false},hideOnMobile=${hideOnMobile?:false}"
            class="px-3 py-4 text-sm whitespace-nowrap first:pl-4 last:pr-4 sm:first:pl-6 sm:last:pr-6"
            th:classappend="|${primary?'font-medium text-gray-900 dark:text-white':'text-gray-500 dark:text-gray-400'} ${hideOnMobile?'hidden sm:table-cell':''}|"
            th:text="${contents}">
            Table data contents
        </td>
        <!-- end::td[] -->
        <!-- tag::tdWithLink[] -->
        <td th:fragment="dataWithLink(linkText, linkUrl)"
            class="py-4 pr-4 pl-3 text-right text-sm font-medium whitespace-nowrap sm:pr-6">
            <a th:href="${linkUrl}"
               th:text="${linkText}"
               class="text-indigo-600 hover:text-indigo-900 dark:text-indigo-400 dark:hover:text-indigo-300">Edit</a>
        </td>
        <!-- end::tdWithLink[] -->
    </tr>
    </tbody>
</table>
</body>
</html>
