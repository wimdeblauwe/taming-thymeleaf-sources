<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <title th:text="#{error}">Error</title>
</head>
<body>
<!--/*@thymesVar id="url" type="String"*/-->
<div layout:fragment="page-content">
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white"
        th:text="#{error}">Error</h1>
    <div class="mt-4 text-gray-600 dark:text-gray-400">
        <p th:text="#{error.page.forbidden}" class="mb-6">The current user is not allowed to access this page.</p>
        <a th:href="@{/}"
           class="inline-flex items-center gap-x-2 text-sm font-semibold text-green-600 hover:text-green-500 dark:text-green-400 dark:hover:text-green-300">
            <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true" class="size-5">
                <path d="M17 10a.75.75 0 0 1-.75.75H5.612l4.158 3.96a.75.75 0 1 1-1.04 1.08l-5.5-5.25a.75.75 0 0 1 0-1.08l5.5-5.25a.75.75 0 1 1 1.04 1.08L5.612 9.25H16.25A.75.75 0 0 1 17 10Z"
                      clip-rule="evenodd" fill-rule="evenodd"/>
            </svg>
            <span th:text="#{back.to.home.page}">Back to home page</span>
        </a>
    </div>
</div>
</body>
</html>
