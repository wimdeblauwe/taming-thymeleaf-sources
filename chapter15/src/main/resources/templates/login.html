<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en"
      class="h-full bg-gray-50 dark:bg-gray-900">
<head>
    <meta charset="UTF-8">
    <title>Taming Thymeleaf - Login</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <link rel="stylesheet" href="https://rsms.me/inter/inter.css"/>
    <vite:client></vite:client>
    <vite:vite>
        <vite:entry value="/css/application.css"></vite:entry>
    </vite:vite>
</head>
<body class="h-full">
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <img th:src="@{/svg/application-logo.svg}" alt="Application Logo" class="mx-auto h-10 w-auto"/>
        <h2 class="mt-6 text-center text-2xl/9 font-bold tracking-tight text-gray-900 dark:text-white"
            th:text="#{login.title}">Sign in to your account</h2>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
        <div class="bg-white px-6 py-12 shadow-sm sm:rounded-lg sm:px-12 dark:bg-gray-800/50 dark:shadow-none dark:outline dark:-outline-offset-1 dark:outline-white/10">
            <form th:action="@{/login}" method="post" class="space-y-6"> <!--.-->
                <!-- tag::login-error[] -->
                <th:block th:if="${param.error}"> <!--.-->
                    <div th:replace="~{fragments/alerts :: error(#{login.error})}"></div>
                </th:block>
                <!-- end::login-error[] -->
                <!-- tag::logout-confirmation[] -->
                <th:block th:if="${param.logout}"> <!--.-->
                    <div th:replace="~{fragments/alerts :: success(#{login.logout.confirmation})}"></div>
                </th:block>
                <!-- end::logout-confirmation[] -->
                <div>
                    <label for="username" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                           th:text="#{login.username}">Username</label>
                    <div class="mt-2">
                        <input id="username" type="text" name="username" required autocomplete="username"
                               class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-green-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-green-500"/> <!--.-->
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm/6 font-medium text-gray-900 dark:text-white"
                           th:text="#{login.password}">Password</label>
                    <div class="mt-2">
                        <input id="password" type="password" name="password" required autocomplete="current-password"
                               class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-green-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-green-500"/> <!--.-->
                    </div>
                </div>

                <div>
                    <button id="submit-button"
                            type="submit"
                            class="flex w-full justify-center rounded-md bg-green-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-green-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600 dark:bg-green-500 dark:shadow-none dark:hover:bg-green-400 dark:focus-visible:outline-green-500"
                            th:text="#{login.signin}">Sign in
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/webjars/alpinejs/dist/cdn.min.js}" defer></script>
<script th:replace="~{fragments/alerts :: alert-js}"></script>
</body>
</html>
